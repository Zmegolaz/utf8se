<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>utf8.se, the UTF-8 toolbox</title>
  <meta name="description" content="A modular collection of browser-based UTF-8 and Unicode tools, generators and quirky experiments. No backend, no tracking.">
  <link rel="preconnect" href="">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A4%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="app" id="app">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand" id="brand" title="Home">
        <span class="logo">utf8</span><span class="tld">.se</span>
      </div>
      <div class="menu-search">
        <input type="text" id="menuSearch" placeholder="Filter tools..." autocomplete="off" spellcheck="false">
      </div>
      <nav class="menu" id="menu"></nav>
      <div class="sidebar-foot">
        Runs entirely in your browser.<br>
        Unicode <span id="ucdVersion">16.0</span> · no tracking.
      </div>
    </aside>

    <main class="main">
      <div id="view" class="view"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
